services:
  frontend:
    build: .
    container_name: orcafast-frontend
    ports:
      - "3000:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./.env:/app/.env
      - ./vite.config.js:/app/vite.config.js
      - node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  node_modules: