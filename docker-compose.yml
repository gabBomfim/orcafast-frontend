services:
  frontend:
    build: .
    container_name: orcafast-frontend
    ports:
      - "3000:5173"  # Frontend acessível em localhost:3000
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./vite.config.js:/app/vite.config.js
      - ./rootReducer.js:/app/rootReducer.js
      - node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  node_modules:
